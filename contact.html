<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-lang="metaTitleContact"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- 顶部导航栏：全站共享的导航与语言切换 -->
  <nav class="navbar navbar-expand-lg navbar-light sticky-top bg-white">
    <div class="container py-2">
      <a class="navbar-brand" href="index.html" data-lang="navBrand"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html" data-lang="navHome"></a></li>
          <li class="nav-item"><a class="nav-link" href="research.html" data-lang="navResearch"></a></li>
          <li class="nav-item"><a class="nav-link" href="people.html" data-lang="navPeople"></a></li>
          <li class="nav-item"><a class="nav-link" href="activities.html" data-lang="navActivities"></a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html" data-lang="navContact"></a></li>
        </ul>
        <div class="language-switch ms-lg-3 d-flex gap-2 mt-3 mt-lg-0">
          <button class="btn btn-outline-secondary btn-sm" onclick="setLanguage('en')" data-lang="langEnglish">EN</button>
          <button class="btn btn-outline-secondary btn-sm" onclick="setLanguage('zh')" data-lang="langChinese">中文</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 页面主体：联系信息与地图占位 -->
  <main class="container py-5">
    <div class="row g-5 align-items-center">
      <div class="col-lg-6">
        <!-- 联系信息区：标题、引导与联系方式 -->
        <h1 class="section-title mb-3" data-lang="contactTitle"></h1>
        <p class="section-lead mb-4" data-lang="contactLead"></p>
        <ul class="list-unstyled mb-4">
          <li class="mb-3">
            <strong data-lang="contactEmailLabel"></strong>
            <a href="qianc@sjtu.edu.cn" data-lang="contactEmailValue"></a>
          </li>
          <li class="mb-3">
            <strong data-lang="contactAddressLabel"></strong>
            <span data-lang="contactAddressValue"></span>
          </li>
          <li class="mb-3">
            <strong data-lang="contactOfficeLabel"></strong>
            <span data-lang="contactOfficeValue"></span>
          </li>
        </ul>
        <a class="btn btn-primary" href="mailto:aail@research.example" data-lang="contactButton"></a>
      </div>
      <div class="col-lg-6">
        <!-- 地图占位区：可替换为地图嵌入或图片 -->
        <div class="map-placeholder d-flex align-items-center justify-content-center text-center p-4">
          <div>
            <h6 class="fw-bold" data-lang="mapTitle"></h6>
            <p class="mb-0 text-muted" data-lang="mapDesc"></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 页脚：版权与副标题 -->
  <footer class="footer py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
      <span class="text-muted" data-lang="footerCopy"></span>
      <div class="small text-muted" data-lang="footerTagline"></div>
    </div>
  </footer>

  <!-- 脚本：Bootstrap、通用交互、语言切换 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="assets/js/main.js"></script>
  <script src="/assets/js/lang.js"></script>
</body>
</html>
