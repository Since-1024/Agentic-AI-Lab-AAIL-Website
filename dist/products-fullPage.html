<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-lang="metaTitleProducts"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
</head>
<body>
    <!-- 顶部导航栏：全站共享的导航与语言切换 -->
  <nav class="navbar navbar-expand-lg navbar-light sticky-top bg-white">
    <div class="container py-2">
      <a class="navbar-brand" href="#home" data-lang="navBrand"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="./index.html#home" data-lang="navHome"></a></li>
          <li class="nav-item"><a class="nav-link" href="./index.html#news" data-lang="navNews"></a></li>
          <li class="nav-item"><a class="nav-link" href="./index.html#products" data-lang="navProducts"></a></li>
          <li class="nav-item"><a class="nav-link" href="./index.html#research" data-lang="navResearch"></a></li>
          <li class="nav-item"><a class="nav-link" href="./index.html#people" data-lang="navPeople"></a></li>
          <li class="nav-item"><a class="nav-link" href="./index.html#activities" data-lang="navActivities"></a></li>
          <li class="nav-item"><a class="nav-link" href="./index.html#contact" data-lang="navContact"></a></li>
        </ul>
        <div class="language-switch ms-lg-3 d-flex gap-2 mt-3 mt-lg-0">
          <button class="btn btn-outline-secondary btn-sm" onclick="setLanguage('en')" data-lang="langEnglish">EN</button>
          <button class="btn btn-outline-secondary btn-sm" onclick="setLanguage('zh')" data-lang="langChinese">中文</button>
        </div>
      </div>
    </div>
  </nav>


  <main class="container py-5">
        <!-------------------------------------------------- 代表性产品 ---------------------------------------------->
    <section id="products" class="mb-5">
      <div class="mb-5 text-center">
        <h1 class="section-title mb-3" data-lang="productsTitle"></h1>
        <p class="section-lead mx-auto" data-lang="productsLead"></p>
      </div>

      <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col">
          <div class="card h-100 border-0 shadow-sm card-shadow">
            <img src="assets/Images/ProductsImage/ChatDev.png"
                style="max-height: 300px; width: 400px; margin: 0 auto;"
                class="card-img-top" alt="ChatDev" />
            <div class="card-body">
              <h5 class="card-title" data-lang="product1Title"></h5>
              <p class="card-text" data-lang="product1Desc"></p>
              <div class="d-flex justify-content-center mt-2">
                <a href="https://github.com/OpenBMB/ChatDev"
                  target="_blank"
                  class="btn btn-outline-primary"
                  data-lang="productlink">
                  <i class="bi bi-github me-2"></i>
                  GitHub
                </a>
              </div>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 border-0 shadow-sm card-shadow">
            <img src="assets/Images/ProductsImage/TeachMaster.png"
                style="max-height: 160px; width: auto; margin: 0 auto;"
                class="card-img-top" alt="TeachMaster" />
            <div class="card-body">
              <h5 class="card-title" data-lang="product2Title"></h5>
              <p class="card-text" data-lang="product2Desc"></p>
              <div class="d-flex justify-content-center mt-2">
                <a href="https://www.teachmaster.cn/"
                  target="_blank"
                  class="btn btn-outline-primary"
                  data-lang="productlink">
                  <i class="bi bi-box-arrow-up-right me-2"></i>
                  Website
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
    <!-- 页脚：版权与副标题 -->
  <footer class="footer py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
      <span class="text-muted" data-lang="footerCopy"></span>
      <div class="small text-muted" data-lang="footerTagline"></div>
    </div>
  </footer>

    <!-- 脚本：Bootstrap、通用交互、语言切换 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/lang.js"></script>

</body>
</html>
