<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-lang="metaTitleHome"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- 顶部导航栏：全站共享的导航与语言切换 -->
  <nav class="navbar navbar-expand-lg navbar-light sticky-top bg-white">
    <div class="container py-2">
      <a class="navbar-brand" href="index.html" data-lang="navBrand"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html" data-lang="navHome"></a></li>
          <li class="nav-item"><a class="nav-link" href="research.html" data-lang="navResearch"></a></li>
          <li class="nav-item"><a class="nav-link" href="people.html" data-lang="navPeople"></a></li>
          <li class="nav-item"><a class="nav-link" href="activities.html" data-lang="navActivities"></a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html" data-lang="navContact"></a></li>
        </ul>
        <div class="language-switch ms-lg-3 d-flex gap-2 mt-3 mt-lg-0">
          <button class="btn btn-outline-secondary btn-sm" onclick="setLanguage('en')" data-lang="langEnglish">EN</button>
          <button class="btn btn-outline-secondary btn-sm" onclick="setLanguage('zh')" data-lang="langChinese">中文</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 页面主体：包含首页英雄区与内容块 -->
  <main class="container py-5">
    <!-- 英雄区：实验室名称、标语、简介与CTA按钮 -->
    <section class="hero mb-5">
      <div class="row align-items-center g-4">
        <div class="col-lg-6">
          <!-- <div class="badge-soft mb-3" data-lang="heroBadge"></div> -->
          <h1 class="hero-title" data-lang="homepageTitle"></h1>
          <p class="hero-tagline mb-4" data-lang="homepageTagline"></p>
          <p class="mb-4" data-lang="homepageIntro"></p>
          <div class="d-flex flex-wrap gap-3">
            <a class="btn btn-outline-primary" href="research.html" data-lang="heroBtnResearch"></a>
            <a class="btn btn-outline-primary" href="people.html" data-lang="heroBtnTeam"></a>
            <a class="btn btn-outline-primary" href="activities.html" data-lang="heroBtnActivities"></a>
          </div>
        </div>
        <div class="col-lg-6 text-center">
          <img src="assets/img/Image-robots.jpeg" class="img-fluid rounded-4 shadow-sm img-banner" alt="AAIL banner" />
        </div>
      </div>
    </section>

    <!-- 研究方向与最新发表 -->
    <section class="mb-5">
      <div class="row g-4 align-items-center">
        <div class="col-lg-6">
          <h2 class="section-title mb-3" data-lang="investigateTitle"></h2>
          <p class="section-lead mb-4" data-lang="investigateLead"></p>
          <div class="row row-cols-1 row-cols-sm-2 g-3">
            <div class="col">
              <div class="p-3 border rounded-4 h-100 card-shadow">
                <h6 class="fw-bold mb-1" data-lang="cardAgenticTitle"></h6>
                <p class="mb-0 small text-muted" data-lang="cardAgenticDesc"></p>
              </div>
            </div>
            <div class="col">
              <div class="p-3 border rounded-4 h-100 card-shadow">
                <h6 class="fw-bold mb-1" data-lang="cardMultiTitle"></h6>
                <p class="mb-0 small text-muted" data-lang="cardMultiDesc"></p>
              </div>
            </div>
            <div class="col">
              <div class="p-3 border rounded-4 h-100 card-shadow">
                <h6 class="fw-bold mb-1" data-lang="cardLLMTitle"></h6>
                <p class="mb-0 small text-muted" data-lang="cardLLMDesc"></p>
              </div>
            </div>
            <div class="col">
              <div class="p-3 border rounded-4 h-100 card-shadow">
                <h6 class="fw-bold mb-1" data-lang="cardResponsibleTitle"></h6>
                <p class="mb-0 small text-muted" data-lang="cardResponsibleDesc"></p>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="p-4 border rounded-4 h-100 bg-white card-shadow">
            <h5 class="fw-bold mb-3" data-lang="highlightsTitle"></h5>
            <ul class="list-unstyled mb-0">
              <li class="d-flex align-items-start gap-3 mb-3">
                <span class="timeline-dot mt-2"></span>
                <div>
                  <div class="fw-semibold" data-lang="highlight1Title"></div>
                  <div class="text-muted small" data-lang="highlight1Desc"></div>
                </div>
              </li>
              <li class="d-flex align-items-start gap-3 mb-3">
                <span class="timeline-dot mt-2"></span>
                <div>
                  <div class="fw-semibold" data-lang="highlight2Title"></div>
                  <div class="text-muted small" data-lang="highlight2Desc"></div>
                </div>
              </li>
              <li class="d-flex align-items-start gap-3">
                <span class="timeline-dot mt-2"></span>
                <div>
                  <div class="fw-semibold" data-lang="highlight3Title"></div>
                  <div class="text-muted small" data-lang="highlight3Desc"></div>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 页脚：版权与副标题 -->
  <footer class="footer py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
      <span class="text-muted" data-lang="footerCopy"></span>
      <div class="small text-muted" data-lang="footerTagline"></div>
    </div>
  </footer>

  <!-- 脚本：Bootstrap、通用交互、语言切换 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="assets/js/main.js"></script>
  <script src="/assets/js/lang.js"></script>
</body>
</html>
